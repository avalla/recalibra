<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>VagoFlow Home</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings:
                'FILL' 0,
                'wght' 300,
                'GRAD' 0,
                'opsz' 24;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ecc8",
                        "background-light": "#f6f8f8",
                        "background-dark": "#10221f",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark group/design-root overflow-x-hidden">
<main class="flex-1 pb-24">
<!-- Top App Bar -->
<div class="flex items-center p-4">
<div class="text-primary flex size-12 shrink-0 items-center justify-start">
<span class="material-symbols-outlined !text-3xl">spa</span>
</div>
<h2 class="flex-1 text-center text-lg font-bold leading-tight tracking-[-0.015em] text-gray-900 dark:text-white">VagoFlow</h2>
<div class="flex w-12 items-center justify-end">
<button class="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-12 bg-transparent text-gray-900 dark:text-white gap-2 text-base font-bold leading-normal tracking-[0.015em] min-w-0 p-0">
<span class="material-symbols-outlined">settings</span>
</button>
</div>
</div>
<!-- Headline Text -->
<h1 class="text-gray-900 dark:text-white tracking-light text-[32px] font-bold leading-tight px-4 pb-3 pt-6 text-left">Hi Jane, let’s recalibrate</h1>
<!-- Section Header: Today's status -->
<h3 class="text-gray-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] px-4 pb-2 pt-4">Today's status</h3>
<!-- Stats -->
<div class="flex flex-wrap gap-4 p-4">
<div class="flex min-w-[158px] flex-1 flex-col gap-2 rounded-xl p-6 bg-white/5 dark:border dark:border-white/10">
<p class="text-gray-600 dark:text-gray-300 text-base font-medium leading-normal">Stress Level</p>
<p class="text-gray-900 dark:text-white tracking-light text-2xl font-bold leading-tight">Calm</p>
</div>
<div class="flex min-w-[158px] flex-1 flex-col gap-2 rounded-xl p-6 bg-white/5 dark:border dark:border-white/10">
<p class="text-gray-600 dark:text-gray-300 text-base font-medium leading-normal">HRV</p>
<p class="text-gray-900 dark:text-white tracking-light text-2xl font-bold leading-tight">65ms</p>
</div>
</div>
<!-- Single Button CTA -->
<div class="flex px-4 py-3">
<button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-12 px-5 flex-1 bg-primary text-background-dark text-base font-bold leading-normal tracking-[0.015em]">
<span class="truncate">Start a Session</span>
</button>
</div>
<!-- Section Header: Suggested for you -->
<h3 class="text-gray-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] px-4 pb-2 pt-6">Suggested for you today</h3>
<!-- Suggested Exercise Card -->
<div class="px-4 py-2">
<div class="flex flex-col gap-4 rounded-xl p-6 bg-primary/20">
<div class="flex items-center gap-4">
<div class="flex h-12 w-12 items-center justify-center rounded-full bg-primary/40 text-primary">
<span class="material-symbols-outlined !text-3xl">self_improvement</span>
</div>
<div class="flex flex-col">
<p class="text-gray-900 dark:text-white text-lg font-bold leading-tight">Mindful Breathing</p>
<p class="text-gray-600 dark:text-gray-300 text-base leading-normal">10 min</p>
</div>
</div>
</div>
</div>
<!-- Section Header: Your Progress -->
<h3 class="text-gray-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] px-4 pb-2 pt-6">Your progress</h3>
<!-- Secondary Info Cards -->
<div class="flex flex-wrap gap-4 p-4">
<div class="flex min-w-[158px] flex-1 flex-col gap-2 rounded-xl p-6 bg-white/5 dark:border dark:border-white/10">
<p class="text-gray-600 dark:text-gray-300 text-sm font-medium leading-normal">Last session</p>
<p class="text-gray-900 dark:text-white tracking-light text-xl font-bold leading-tight">Yesterday, 10 min</p>
</div>
<div class="flex min-w-[158px] flex-1 flex-col gap-2 rounded-xl p-6 bg-white/5 dark:border dark:border-white/10">
<p class="text-gray-600 dark:text-gray-300 text-sm font-medium leading-normal">This week</p>
<div class="flex items-center gap-2 pt-1">
<div class="h-6 w-6 rounded-full bg-primary"></div>
<div class="h-6 w-6 rounded-full bg-primary"></div>
<div class="h-6 w-6 rounded-full bg-primary"></div>
<div class="h-6 w-6 rounded-full bg-gray-200 dark:bg-white/10"></div>
<div class="h-6 w-6 rounded-full bg-gray-200 dark:bg-white/10"></div>
</div>
</div>
</div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 right-0 border-t border-gray-200/50 bg-background-light/80 backdrop-blur-sm dark:border-white/10 dark:bg-background-dark/80">
<div class="mx-auto flex max-w-md justify-around px-4 py-2">
<div class="flex flex-col items-center gap-1 p-2 text-primary">
<span class="material-symbols-outlined">home</span>
<span class="text-xs font-bold">Home</span>
</div>
<div class="flex flex-col items-center gap-1 p-2 text-gray-400 dark:text-gray-500">
<span class="material-symbols-outlined">exercise</span>
<span class="text-xs font-medium">Exercises</span>
</div>
<div class="flex flex-col items-center gap-1 p-2 text-gray-400 dark:text-gray-500">
<span class="material-symbols-outlined">bar_chart</span>
<span class="text-xs font-medium">Progress</span>
</div>
<div class="flex flex-col items-center gap-1 p-2 text-gray-400 dark:text-gray-500">
<span class="material-symbols-outlined">person</span>
<span class="text-xs font-medium">Profile</span>
</div>
</div>
</nav>
</div>
</body></html>
