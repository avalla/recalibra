<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>VagoFlow Exercise Player</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ecc8",
                        "background-light": "#f6f8f8",
                        "background-dark": "#10221f",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-light dark:bg-background-dark">
<div class="relative flex h-screen w-full flex-col dark group/design-root overflow-hidden">
<!-- Top App Bar -->
<div class="flex items-center p-4">
<button class="text-white/80 dark:text-white/80">
<span class="material-symbols-outlined text-3xl">close</span>
</button>
<h2 class="text-white dark:text-white text-lg font-bold leading-tight flex-1 text-center pr-8">Resonant Coherence</h2>
</div>
<!-- Progress Bar -->
<div class="flex flex-col gap-2 px-4 pt-2 pb-6">
<div class="rounded-full bg-white/10 dark:bg-white/10">
<div class="h-2 rounded-full bg-primary" style="width: 35%;"></div>
</div>
<div class="flex justify-between">
<p class="text-white/60 dark:text-white/60 text-sm font-normal leading-normal">1:15</p>
<p class="text-white/60 dark:text-white/60 text-sm font-normal leading-normal">5:00</p>
</div>
</div>
<div class="flex flex-1 flex-col justify-center items-center px-4 space-y-8">
<!-- Headline Text -->
<div class="text-center">
<h1 class="text-white dark:text-white tracking-light text-[32px] font-bold leading-tight">Inhale</h1>
<p class="text-primary text-5xl font-bold">4s</p>
</div>
<!-- Breathing Animation Visual -->
<div class="relative flex items-center justify-center w-full max-w-xs aspect-square">
<!-- Outer Ring (Progress) -->
<svg class="absolute inset-0 size-full" viewbox="0 0 100 100">
<circle class="stroke-current text-white/10 dark:text-white/10" cx="50" cy="50" fill="transparent" r="48" stroke-width="4"></circle>
<circle class="stroke-current text-primary -rotate-90 origin-center" cx="50" cy="50" fill="transparent" r="48" stroke-dasharray="301.59" stroke-dashoffset="196" stroke-linecap="round" stroke-width="4"></circle>
</svg>
<!-- Central Pulsating Circle -->
<div class="w-4/5 h-4/5 rounded-full bg-primary/20 dark:bg-primary/20 flex items-center justify-center">
<div class="w-2/3 h-2/3 rounded-full bg-primary/30 dark:bg-primary/30"></div>
</div>
</div>
<!-- Body Text / Mantra -->
<p class="text-white/80 dark:text-white/80 text-lg font-normal leading-normal text-center pt-4">Be present in this moment.</p>
</div>
<!-- Bottom Controls -->
<div class="flex items-center justify-around p-6 pb-12">
<button class="p-3 text-white/80 dark:text-white/80 hover:text-white dark:hover:text-white transition-colors">
<span class="material-symbols-outlined text-3xl">volume_up</span>
</button>
<button class="bg-primary text-background-dark p-6 rounded-full shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-5xl">pause</span>
</button>
<button class="p-3 text-white/80 dark:text-white/80 hover:text-white dark:hover:text-white transition-colors">
<span class="material-symbols-outlined text-3xl">info</span>
</button>
</div>
</div>
</body></html>
