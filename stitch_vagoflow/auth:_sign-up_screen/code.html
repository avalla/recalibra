<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Recalibra - Create Account</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#13ecc8",
              "background-light": "#f6f8f8",
              "background-dark": "#10221f",
            },
            fontFamily: {
              "display": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex min-h-screen w-full flex-col items-center justify-center p-4">
<div class="w-full max-w-md">
<!-- App Logo -->
<div class="flex justify-center mb-6">
<svg fill="none" height="48" viewbox="0 0 48 48" width="48" xmlns="http://www.w3.org/2000/svg">
<path d="M24 4C12.9543 4 4 12.9543 4 24C4 35.0457 12.9543 44 24 44C35.0457 44 44 35.0457 44 24C44 12.9543 35.0457 4 24 4Z" fill="#13ecc8" fill-opacity="0.2"></path>
<path d="M18 18C20.3636 21.3333 22.7273 24.6667 24 26C25.2727 24.6667 27.6364 21.3333 30 18" stroke="#13ecc8" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
<path d="M18 30C20.3636 26.6667 22.7273 23.3333 24 22C25.2727 23.3333 27.6364 26.6667 30 30" stroke="#13ecc8" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<!-- HeadlineText -->
<h1 class="text-slate-900 dark:text-white text-[32px] font-bold leading-tight tracking-tight text-center pb-8">Create Your Account</h1>
<!-- ButtonGroup for Social Sign-Up -->
<div class="flex w-full flex-col items-stretch gap-3">
<button class="flex h-12 w-full min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-lg bg-slate-200 px-5 text-base font-bold leading-normal tracking-[0.015em] text-slate-900 dark:bg-zinc-800 dark:text-white">
<span class="material-symbols-outlined mr-2 text-xl">ios</span>
<span class="truncate">Continue with Apple</span>
</button>
<button class="flex h-12 w-full min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-lg bg-slate-200 px-5 text-base font-bold leading-normal tracking-[0.015em] text-slate-900 dark:bg-zinc-800 dark:text-white">
<svg class="mr-2" fill="none" height="20" viewbox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path></svg>
<span class="truncate">Continue with Google</span>
</button>
</div>
<!-- MetaText Divider -->
<p class="py-6 text-center text-sm font-normal leading-normal text-slate-500 dark:text-zinc-400">OR</p>
<!-- TextFields for Email Sign-Up -->
<div class="flex w-full flex-col gap-4">
<label class="flex flex-col">
<p class="pb-2 text-base font-medium text-slate-700 dark:text-zinc-200">Email Address</p>
<input class="form-input flex h-14 w-full flex-1 resize-none overflow-hidden rounded-lg border border-slate-300 bg-white p-4 text-base font-normal leading-normal text-slate-900 placeholder:text-slate-400 focus:border-primary/50 focus:outline-0 focus:ring-2 focus:ring-primary/20 dark:border-zinc-700 dark:bg-zinc-800 dark:text-white dark:placeholder:text-zinc-500 dark:focus:border-primary/50" placeholder="name@email.com" value=""/>
</label>
<label class="flex flex-col">
<p class="pb-2 text-base font-medium text-slate-700 dark:text-zinc-200">Password</p>
<div class="flex w-full flex-1 items-stretch">
<input class="form-input flex h-14 w-full min-w-0 flex-1 resize-none overflow-hidden rounded-l-lg border border-r-0 border-slate-300 bg-white p-4 pr-2 text-base font-normal leading-normal text-slate-900 placeholder:text-slate-400 focus:border-primary/50 focus:outline-0 focus:ring-2 focus:ring-primary/20 dark:border-zinc-700 dark:bg-zinc-800 dark:text-white dark:placeholder:text-zinc-500 dark:focus:border-primary/50" placeholder="Enter your password" type="password" value=""/>
<div class="flex cursor-pointer items-center justify-center rounded-r-lg border border-l-0 border-slate-300 bg-white px-4 text-slate-400 dark:border-zinc-700 dark:bg-zinc-800 dark:text-zinc-500">
<span class="material-symbols-outlined text-2xl">visibility</span>
</div>
</div>
</label>
<label class="flex flex-col">
<p class="pb-2 text-base font-medium text-slate-700 dark:text-zinc-200">Confirm Password</p>
<input class="form-input flex h-14 w-full flex-1 resize-none overflow-hidden rounded-lg border border-slate-300 bg-white p-4 text-base font-normal leading-normal text-slate-900 placeholder:text-slate-400 focus:border-primary/50 focus:outline-0 focus:ring-2 focus:ring-primary/20 dark:border-zinc-700 dark:bg-zinc-800 dark:text-white dark:placeholder:text-zinc-500 dark:focus:border-primary/50" placeholder="Confirm your password" value=""/>
</label>
</div>
<!-- Primary CTA Button -->
<div class="mt-6 flex flex-col items-stretch">
<button class="flex h-12 w-full min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-lg bg-primary px-5 text-base font-bold leading-normal tracking-[0.015em] text-background-dark">
<span class="truncate">Sign Up</span>
</button>
</div>
<!-- Legal and Log In Links -->
<div class="mt-8 text-center">
<p class="text-xs text-slate-500 dark:text-zinc-400">
                    By signing up, you agree to our <a class="font-medium text-primary/80 underline-offset-2 hover:text-primary hover:underline" href="#">Privacy &amp; Medical Disclaimer</a>.
                </p>
<p class="mt-4 text-sm text-slate-600 dark:text-zinc-300">
                    Already have an account? <a class="font-bold text-primary/80 hover:text-primary hover:underline" href="#">Log In</a>
</p>
</div>
</div>
</div>
</body></html>
